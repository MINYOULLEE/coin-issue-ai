<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="theme-color" content="#132238"><title>Coin Issue AI</title>
<style>
:root{--bg:#eef2f7;--surface:#fff;--soft:#f5f7fb;--line:#dce3ed;--text:#142033;--muted:#6c7a90;--navy:#132238;--blue:#2563eb;--blue2:#e8f0ff;--green:#079669;--green-bg:#e7f8f1;--red:#dc3b51;--red-bg:#fff0f2;--orange:#e87824;--shadow:0 8px 26px rgba(31,48,76,.08)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#e8eef6 0,#f4f6f9 300px);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:3;padding:15px 4%;background:rgba(19,34,56,.96);border-bottom:1px solid rgba(255,255,255,.1);box-shadow:0 5px 20px rgba(18,31,50,.16);backdrop-filter:blur(14px)}
.top{max-width:1450px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:12px}.brandmark{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;background:linear-gradient(145deg,#4f86ff,#245ad1);box-shadow:0 6px 18px rgba(50,105,232,.4);font-size:20px}.brand h1{font-size:20px;line-height:1.15;margin:0;color:#fff;letter-spacing:-.3px}.brand small{display:block;color:#aebbd0;margin-top:3px;font-size:11px;letter-spacing:.4px}
.status{display:flex;align-items:center;color:#b8ffe4;background:rgba(24,174,119,.14);border:1px solid rgba(93,231,178,.25);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700}.status.off{color:#ffd0d6;background:rgba(225,65,86,.14);border-color:rgba(255,115,135,.25)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;margin-right:7px}
.wrap{max-width:1450px;margin:auto;padding:25px 4% 50px}.market,.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}.box,.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow)}
.market .box{position:relative;overflow:hidden;min-height:96px}.market .box:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#4f82ed,#285fd0)}.ticker b{font-size:15px;color:#23334d}.ticker{color:#35445b}.ticker .good,.ticker .bad{display:inline-block;margin-top:4px;font-weight:800}
.stats .box{box-shadow:none;background:rgba(255,255,255,.82);color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.1px}.good{color:var(--green)}.bad{color:var(--red)}.muted{color:var(--muted)}.num{font-size:25px;line-height:1.15;font-weight:850;color:var(--text);margin-top:7px;letter-spacing:-.5px}
.tabs{position:sticky;top:70px;z-index:2;display:flex;gap:7px;flex-wrap:wrap;margin:19px 0;padding:10px;background:rgba(244,246,249,.9);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);box-shadow:0 5px 18px rgba(36,51,76,.06)}button{background:#fff;color:#46556c;border:1px solid #d5deea;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer;transition:.16s ease}button:hover{color:var(--blue);border-color:#9db9f5;transform:translateY(-1px)}button.on{background:linear-gradient(135deg,#326de8,#255bc9);border-color:#255bc9;color:#fff;box-shadow:0 5px 13px rgba(37,91,201,.25)}
main{display:grid;gap:14px}.card{margin:0}.card h2{font-size:19px;margin:3px 0;letter-spacing:-.35px}.card h3{margin:20px 0 9px;font-size:13px;color:#506078;text-transform:uppercase;letter-spacing:.4px}.card p{color:#435168}.forecast{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.forecast>div,.reason{background:var(--soft);border:1px solid #e6ebf2;border-radius:11px;padding:13px;line-height:1.6}.forecast>div{min-height:118px}.forecast>div b{color:#263752}.forecast small{color:var(--muted)}.reason{margin-top:11px;color:#435168}.reason b{color:#263752}.issue{border-left:4px solid #4b76d1}.head{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.head h2{margin-right:auto}.grade{color:#fff;font-weight:900;padding:5px 9px;border-radius:7px;font-size:12px}.S{background:#d92b50}.A{background:#e26c28}.B{background:#ad8421}.C,.D{background:#617089}.title{font-size:17px;font-weight:800;margin:13px 0 7px;color:#17243a}.summary{color:#506078;line-height:1.7}.meta{font-size:12px;color:var(--muted);margin-top:11px}.meta a{color:var(--blue);font-weight:700;text-decoration:none}.meta a:hover{text-decoration:underline}.empty{text-align:center;padding:65px;color:var(--muted)}
@media(max-width:900px){.market,.stats{grid-template-columns:repeat(2,1fr)}.forecast{grid-template-columns:1fr}.tabs{top:68px}.wrap{padding:18px 3% 40px}}@media(max-width:540px){header{padding:12px 4%}.brand small{display:none}.brandmark{width:34px;height:34px}.status{max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.market,.stats{gap:8px}.box,.card{padding:13px;border-radius:12px}.num{font-size:21px}.tabs{margin:13px 0;padding:8px}button{padding:8px 10px;font-size:12px}}
</style></head>
<body><header><div class="top"><div class="brand"><span class="brandmark">⚡</span><div><h1>Coin Issue AI</h1><small>REAL-TIME CRYPTO INTELLIGENCE</small></div></div><div id="live" class="status off"><span class="dot"></span><span id="liveText">연결 확인 중</span></div></div></header><div class="wrap"><div id="market" class="market"></div><div class="stats"><div class="box">오늘 감지<div id="today" class="num">-</div></div><div class="box">긴급 S/A<div id="urgent" class="num">-</div></div><div class="box">호재<div id="good" class="num good">-</div></div><div class="box">악재<div id="bad" class="num bad">-</div></div><div class="box">수집 상태<div id="collector" class="num">-</div></div></div><div class="tabs"><button class="on" data-filter="recommend">⭐ 종합추천</button><button data-filter="hot">🔥 핫이슈</button><button data-filter="all">전체</button><button data-filter="BTC">BTC</button><button data-filter="ETH">ETH</button><button data-filter="XRP">XRP</button><button data-filter="SOL">SOL</button><button data-filter="BNB">BNB</button><button data-filter="good">호재</button><button data-filter="bad">악재</button></div><main id="content"><div class="card empty">데이터를 불러오는 중입니다.</div></main></div>
<script src="config.js"></script><script>
const C=window.COIN_ISSUE_CONFIG||{};let DATA=null,FILTER='recommend';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=(n,p=100)=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:p<10?4:2});
function scenario(label,o,p){return `<div><b>${label} · ${o?.prob??'-'}%</b><br>중심 ${money(o?.center,p)} (${Number(o?.change||0)>=0?'+':''}${Number(o?.change||0).toFixed(2)}%)<br><small>${money(o?.low,p)} ~ ${money(o?.high,p)}</small><br><small>${esc(o?.trigger||'')}</small></div>`}
function render(){if(!DATA)return;const d=DATA,s=d.stats||{};$('today').textContent=s.today??0;$('urgent').textContent=s.urgent??0;$('good').textContent=s.good??0;$('bad').textContent=s.bad??0;$('collector').textContent='LOCAL';$('market').innerHTML=Object.entries(d.market||{}).map(([k,v])=>`<div class="box ticker"><b>${k}</b><br>${money(v.price,v.price)}<br><span class="${v.change>=0?'good':'bad'}">${v.change>=0?'+':''}${Number(v.change).toFixed(2)}%</span></div>`).join('');
if(FILTER==='recommend'){$('content').innerHTML=Object.entries(d.market||{}).map(([k,v])=>`<article class="card"><div class="head"><h2>${k}</h2><b class="${String(v.recommendation).includes('상승')?'good':String(v.recommendation).includes('하락')?'bad':'muted'}">${esc(v.recommendation||'계산 중')}</b></div><p><b>${esc(v.trend_direction||'-')} 추세 강도 ${v.trend_strength??'-'}/100</b> · 방향 신뢰도 ${v.direction_confidence??'-'}%</p><p>현재가 <b>${money(v.price,v.price)}</b> · 24h ${Number(v.change)>=0?'+':''}${Number(v.change).toFixed(2)}% · 거래량 ${Number(v.volume_ratio||0).toFixed(2)}배</p>${v.scenarios24?`<h3>24시간 시나리오</h3><div class="forecast">${scenario('기본',v.scenarios24.base,v.price)}${scenario('강세',v.scenarios24.bull,v.price)}${scenario('약세',v.scenarios24.bear,v.price)}</div><h3>1주 시나리오</h3><div class="forecast">${scenario('기본',v.scenarios7d.base,v.price)}${scenario('강세',v.scenarios7d.bull,v.price)}${scenario('약세',v.scenarios7d.bear,v.price)}</div>`:'<div class="reason">시나리오 계산 중</div>'}<div class="reason"><b>근거</b><br>${(v.reasons||[]).map(esc).join(' · ')||'-'}<br><b>위험</b><br>${(v.risks||[]).map(esc).join(' · ')||'-'}</div></article>`).join('')||'<div class="card empty">시장 데이터 계산 중</div>';return}
if(FILTER==='hot'){const themes=(d.hot_themes||[]).map(x=>`<article class="card"><div class="head"><span class="grade ${x.grade}">${x.grade}급</span><h2>🔥 ${esc(x.title)}</h2></div><p>${esc(x.direction)} · ${esc(x.assets)}</p><div class="reason"><b>중요한 이유</b><br>${esc(x.reason)}<br><br><b>다음 확인</b><br>${esc(x.watch)}</div></article>`).join('');const events=(d.hot_events||[]).map(x=>`<article class="card"><h2>📅 ${esc(x.title)}</h2><p>${new Date(x.event_time).toLocaleString()} · ${esc(x.source)}</p><div class="reason">${esc(x.reason)}<br><br>${esc(x.watch)}</div></article>`).join('');$('content').innerHTML=themes+events||'<div class="card empty">현재 감지된 핫이슈가 없습니다.</div>';return}
let rows=d.issues||[];if(['BTC','ETH','XRP','SOL','BNB'].includes(FILTER))rows=rows.filter(x=>String(x.assets).split(',').includes(FILTER));if(FILTER==='good')rows=rows.filter(x=>x.direction==='호재');if(FILTER==='bad')rows=rows.filter(x=>x.direction==='악재');$('content').innerHTML=rows.map(x=>`<article class="card issue"><div class="head"><span class="grade ${x.grade}">${x.grade}급</span><b class="${x.direction==='호재'?'good':x.direction==='악재'?'bad':'muted'}">${esc(x.direction)}</b><span>${esc(x.assets)}</span><span>정보검증 ${x.confidence}/100</span></div><div class="title">${esc(x.title)}</div><div class="summary">${esc(x.summary)}</div><div class="reason">📊 ${esc(x.reaction)}<br><br><b>투자자 체크</b><br>${esc(x.investor_note)}</div><div class="meta">${esc(x.source)} · ${x.published?new Date(x.published).toLocaleString():'시각 미제공'} · <a href="${esc(x.url)}" target="_blank" rel="noopener">원문</a></div></article>`).join('')||'<div class="card empty">조건에 맞는 최근 이슈가 없습니다.</div>'}
async function load(){try{if(!C.supabaseUrl||String(C.supabaseUrl).startsWith('PASTE_'))throw Error('config.js 설정 필요');const u=C.supabaseUrl.replace(/\/$/,'')+'/rest/v1/coin_snapshots?id=eq.live&select=payload,updated_at',r=await fetch(u,{headers:{apikey:C.supabaseAnonKey,Authorization:'Bearer '+C.supabaseAnonKey},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const rows=await r.json();if(!rows.length)throw Error('첫 동기화 대기');DATA=rows[0].payload;const age=(Date.now()-new Date(DATA.heartbeat||rows[0].updated_at))/1000;$('live').classList.toggle('off',age>Number(C.staleAfterSeconds||45));$('liveText').textContent=age>Number(C.staleAfterSeconds||45)?`수집기 중단 · 마지막 ${Math.floor(age)}초 전`:`실시간 연결 · ${Math.max(0,Math.floor(age))}초 전`;render()}catch(e){$('live').classList.add('off');$('liveText').textContent='연결 대기 · '+e.message}}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');FILTER=b.dataset.filter;render()});load();setInterval(load,Math.max(3,Number(C.refreshSeconds||5))*1000);
</script></body></html>
