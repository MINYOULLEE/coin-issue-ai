<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#182233">
<title>Coin Issue AI</title>
<style>
:root{--bg:#131b28;--bg2:#172131;--panel:#1c2738;--panel2:#222f43;--line:#344258;--line2:#2a374a;--text:#f0f4fa;--muted:#93a2b8;--blue:#668cff;--blue-bg:#283b68;--green:#35d0a0;--green-bg:#183f38;--red:#fb7b8c;--red-bg:#4b2933;--amber:#f1b65b;--amber-bg:#473923;--shadow:0 12px 34px rgba(4,10,20,.18)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -20%,#26364e 0,var(--bg) 38%);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}header{position:sticky;top:0;z-index:5;background:rgba(24,34,51,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.topbar{max-width:1540px;height:68px;margin:auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px;min-width:215px}.brandmark{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:#2c4779;border:1px solid #48679a;font-size:19px}.brand h1{font-size:19px;line-height:1.1;margin:0;letter-spacing:-.3px}.brand small{display:block;margin-top:4px;color:var(--muted);font-size:10px;letter-spacing:.7px}.top-metrics{display:flex;align-items:center;gap:9px}.metric{padding:7px 11px;border-left:1px solid var(--line);color:var(--muted);font-size:11px;white-space:nowrap}.metric b{display:block;color:var(--text);font-size:14px}.status{display:flex;align-items:center;color:#aef2dc;background:rgba(41,167,128,.13);border:1px solid rgba(72,205,164,.28);border-radius:999px;padding:8px 12px;font-size:11px;font-weight:750;white-space:nowrap}.status.off{color:#ffc2cb;background:rgba(196,65,84,.14);border-color:rgba(244,110,129,.25)}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:7px}
.page{max-width:1540px;margin:auto;padding:20px 28px 42px}.market-section{margin-bottom:14px}.section-label{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;color:#bdc8d8;font-size:11px;font-weight:800;letter-spacing:.65px;text-transform:uppercase}.section-label span:last-child{color:var(--muted);font-weight:600;letter-spacing:0;text-transform:none}.market{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.ticker{position:relative;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:11px 13px;overflow:hidden}.ticker:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#5579d4}.ticker b{font-size:13px}.ticker .price{font-size:16px;font-weight:780;margin:4px 0 1px}.good{color:var(--green)}.bad{color:var(--red)}.muted{color:var(--muted)}.ticker .good,.ticker .bad{font-size:11px;font-weight:800}
.workspace{display:grid;grid-template-columns:180px minmax(0,1fr) 300px;gap:12px;align-items:start}.sidebar,.sidepanel,.mainpanel{background:var(--panel);border:1px solid var(--line2);border-radius:13px;box-shadow:var(--shadow)}.sidebar{position:sticky;top:82px;padding:10px}.nav-title{padding:8px 9px 9px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}.tabs{display:grid;gap:4px}.tabs button{width:100%;display:flex;align-items:center;gap:8px;background:transparent;color:#b8c4d5;border:1px solid transparent;border-radius:8px;padding:9px 10px;text-align:left;font-weight:680;cursor:pointer;transition:.15s}.tabs button:hover{background:#243147;color:#fff}.tabs button.on{background:var(--blue-bg);border-color:#3d5689;color:#dfe7ff}.nav-divider{height:1px;background:var(--line2);margin:8px 4px}.sidebar-foot{margin-top:12px;padding:10px;border-radius:9px;background:#172131;color:var(--muted);font-size:11px}.sidebar-foot b{color:var(--text)}
.mainpanel{min-width:0;padding:16px}.panel-title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:13px}.panel-title h2{font-size:18px;margin:0;letter-spacing:-.35px}.panel-title p{margin:3px 0 0;color:var(--muted);font-size:11px}.statsline{display:flex;gap:6px;flex-wrap:wrap}.stat-pill{background:#172131;border:1px solid var(--line2);border-radius:8px;padding:6px 9px;color:var(--muted);font-size:10px}.stat-pill b{color:var(--text);font-size:12px;margin-left:4px}
.compare-wrap{overflow-x:auto;border:1px solid var(--line2);border-radius:10px}.compare{width:100%;border-collapse:collapse;min-width:720px}.compare th{background:#172131;color:var(--muted);font-size:10px;letter-spacing:.45px;text-align:left;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--line2)}.compare td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}.compare tr:last-child td{border-bottom:0}.compare tbody tr{cursor:pointer;transition:.13s}.compare tbody tr:hover{background:#222f43}.compare tbody tr.selected{background:#263653}.coin-cell{display:flex;align-items:center;gap:8px}.coin-icon{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#2d3c53;color:#dce6f7;font-size:10px;font-weight:900}.coin-cell b{font-size:13px}.sub{display:block;color:var(--muted);font-size:10px;margin-top:2px}.signal{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:850}.signal.up{background:var(--green-bg);color:var(--green)}.signal.down{background:var(--red-bg);color:var(--red)}.signal.wait{background:#303b4d;color:#b7c1d0}.prob{font-size:13px;font-weight:850}.bar{width:74px;height:5px;margin-top:5px;background:#111925;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;border-radius:10px;background:var(--blue)}.volume{font-weight:750}.volume.hot{color:var(--amber)}
.detail{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.detail-head h3{margin:0;font-size:17px}.detail-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.trend-score{min-width:94px;text-align:right;color:var(--muted);font-size:10px}.trend-score b{display:block;color:var(--text);font-size:18px}.horizon{margin:15px 0 7px;color:#b9c5d6;font-size:11px;font-weight:850;letter-spacing:.5px;text-transform:uppercase}.forecast{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.scenario{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px}.scenario.base{border-top:3px solid var(--blue)}.scenario.bull{border-top:3px solid var(--green)}.scenario.bear{border-top:3px solid var(--red)}.scenario-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.scenario-top b{font-size:12px}.scenario-top strong{font-size:15px}.scenario .center{font-size:15px;font-weight:800}.scenario small{display:block;color:var(--muted);margin-top:3px;font-size:10px}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.evidence-box{background:#172131;border:1px solid var(--line2);border-radius:9px;padding:11px;color:#b7c2d2;font-size:11px}.evidence-box b{display:block;color:var(--text);margin-bottom:5px}.evidence-box.risk b{color:#ffb2bd}
.sidepanel{position:sticky;top:82px;padding:14px}.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.side-head h3{margin:0;font-size:13px}.side-head span{color:var(--muted);font-size:10px}.focus{background:#172131;border:1px solid var(--line2);border-radius:10px;padding:11px;margin-bottom:8px}.focus .tag{display:inline-block;border-radius:5px;padding:3px 6px;margin-bottom:7px;background:var(--amber-bg);color:var(--amber);font-size:9px;font-weight:900}.focus h4{margin:0 0 5px;font-size:12px;line-height:1.4}.focus p{margin:0;color:var(--muted);font-size:10px;line-height:1.55}.event-time{color:#aebbd0;font-size:10px;font-weight:750;margin-bottom:5px}.side-divider{height:1px;background:var(--line2);margin:13px 0}.risk-item{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:10px;color:#b4c0d0}.risk-item:last-child{border:0}.risk-dot{flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:var(--red);margin-top:5px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:8px}.card h2{font-size:15px;margin:2px 0}.card p{color:#bac5d4}.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grade{color:#fff;font-weight:900;padding:4px 7px;border-radius:5px;font-size:10px}.S{background:#d7435c}.A{background:#d97332}.B{background:#a8832f}.C,.D{background:#596981}.title{font-size:14px;font-weight:800;margin:10px 0 6px}.summary{color:#b7c2d2;line-height:1.65}.reason{background:#172131;border:1px solid var(--line2);border-radius:8px;padding:10px;margin-top:9px;color:#b7c2d2;font-size:11px}.meta{font-size:10px;color:var(--muted);margin-top:9px}.meta a{color:#8eabff;text-decoration:none}.empty{text-align:center;padding:60px;color:var(--muted)}
@media(max-width:1180px){.workspace{grid-template-columns:160px minmax(0,1fr)}.sidepanel{position:static;grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.side-head,.side-divider{grid-column:1/-1}.focus{margin:0}.risk-item{border:0}}
@media(max-width:800px){.topbar{height:auto;min-height:62px;padding:10px 14px}.brand small,.top-metrics{display:none}.page{padding:13px 10px 30px}.market{grid-template-columns:repeat(2,1fr)}.workspace{display:block}.sidebar{position:static;margin-bottom:9px;padding:8px;overflow-x:auto}.nav-title,.nav-divider,.sidebar-foot{display:none}.tabs{display:flex;min-width:max-content}.tabs button{width:auto;padding:8px 10px}.mainpanel{padding:12px}.panel-title{display:block}.statsline{margin-top:8px}.forecast,.evidence{grid-template-columns:1fr}.sidepanel{display:block;margin-top:9px}.side-head,.side-divider{display:flex}.detail-head{display:block}.trend-score{text-align:left;margin-top:8px}.status{max-width:55%;overflow:hidden;text-overflow:ellipsis}.market .ticker:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<header><div class="topbar"><div class="brand"><span class="brandmark">⚡</span><div><h1>Coin Issue AI</h1><small>MARKET INTELLIGENCE TERMINAL</small></div></div><div class="top-metrics"><div class="metric">오늘 감지<b id="today">-</b></div><div class="metric">긴급 S/A<b id="urgent">-</b></div><div class="metric">호재 / 악재<b><span id="good" class="good">-</span> / <span id="bad" class="bad">-</span></b></div></div><div id="live" class="status off"><span class="dot"></span><span id="liveText">연결 확인 중</span></div></div></header>
<div class="page">
  <section class="market-section"><div class="section-label"><span>Major Markets</span><span>실시간 주요 코인</span></div><div id="market" class="market"></div></section>
  <div class="workspace">
    <aside class="sidebar"><div class="nav-title">Intelligence</div><nav class="tabs"><button class="on" data-filter="recommend">⭐ 종합추천</button><button data-filter="hot">🔥 핫이슈</button><button data-filter="all">▦ 전체 이슈</button><div class="nav-divider"></div><button data-filter="BTC">BTC</button><button data-filter="ETH">ETH</button><button data-filter="XRP">XRP</button><button data-filter="SOL">SOL</button><button data-filter="BNB">BNB</button><div class="nav-divider"></div><button data-filter="good">↗ 호재</button><button data-filter="bad">↘ 악재</button></nav><div class="sidebar-foot">수집 엔진<br><b id="collector">CLOUD 24H</b></div></aside>
    <main id="content" class="mainpanel"><div class="empty">데이터를 불러오는 중입니다.</div></main>
    <aside id="sidepanel" class="sidepanel"><div class="side-head"><h3>시장 포커스</h3><span>LIVE</span></div><div class="focus"><h4>데이터 연결 대기</h4><p>수집기가 첫 스냅샷을 전송하면 핵심 이슈가 표시됩니다.</p></div></aside>
  </div>
</div>
<script src="config.js"></script>
<script>
const C=window.COIN_ISSUE_CONFIG||{};let DATA=null,FILTER='recommend',SELECTED='BTC';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=(n,p=100)=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:p<10?4:2}),marketMoney=v=>v?.currency==='KRW'?'₩'+Number(v.price||0).toLocaleString('ko-KR',{maximumFractionDigits:2}):money(v?.price,v?.price);
function signalClass(v){const r=String(v?.recommendation||'');return r.includes('상승')?'up':r.includes('하락')?'down':'wait'}
function scenario(label,o,p,type){return `<div class="scenario ${type}"><div class="scenario-top"><b>${label}</b><strong>${o?.prob??'-'}%</strong></div><div class="center">${money(o?.center,p)} <span class="${Number(o?.change||0)>=0?'good':'bad'}">${Number(o?.change||0)>=0?'+':''}${Number(o?.change||0).toFixed(2)}%</span></div><small>범위 ${money(o?.low,p)} ~ ${money(o?.high,p)}</small><small>${esc(o?.trigger||'')}</small></div>`}
function renderMarket(){const m=DATA?.market||{};$('market').innerHTML=Object.entries(m).map(([k,v])=>`<div class="ticker"><b>${k}${v.source==='Upbit'?' · 업비트':''}</b><div class="price">${marketMoney(v)}</div><span class="${v.change>=0?'good':'bad'}">${v.change>=0?'+':''}${Number(v.change).toFixed(2)}%</span></div>`).join('')}
function renderSide(){const themes=DATA?.hot_themes||[],events=DATA?.hot_events||[],risks=Object.entries(DATA?.market||{}).flatMap(([k,v])=>(v.risks||[]).slice(0,1).map(x=>`${k} · ${x}`)).slice(0,4);let html='<div class="side-head"><h3>시장 포커스</h3><span>LIVE</span></div>';html+=themes.slice(0,3).map(x=>`<div class="focus"><span class="tag">${esc(x.grade||'B')}급 · ${esc(x.direction||'관찰')}</span><h4>${esc(x.title)}</h4><p>${esc(x.reason||x.watch||'')}</p></div>`).join('');if(!themes.length)html+='<div class="focus"><h4>감지된 핵심 테마 없음</h4><p>새로운 규제·거래소·기관 이슈를 계속 확인 중입니다.</p></div>';html+='<div class="side-divider"><div class="side-head"><h3>예정 일정</h3><span>UPCOMING</span></div></div>';html+=events.slice(0,2).map(x=>`<div class="focus"><div class="event-time">${new Date(x.event_time).toLocaleString()}</div><h4>${esc(x.title)}</h4><p>${esc(x.watch||x.reason||'')}</p></div>`).join('')||'<div class="focus"><p>현재 등록된 주요 일정이 없습니다.</p></div>';html+='<div class="side-divider"><div class="side-head"><h3>주요 위험</h3><span>RISK</span></div></div>';html+=risks.map(x=>`<div class="risk-item"><span class="risk-dot"></span><span>${esc(x)}</span></div>`).join('')||'<div class="risk-item"><span class="risk-dot"></span><span>시장 위험 데이터 계산 중</span></div>';$('sidepanel').innerHTML=html}
function renderRecommend(){const m=DATA.market||{},keys=Object.keys(m).filter(k=>k!=='USDT');if(!m[SELECTED])SELECTED=keys[0]||'BTC';const rows=keys.map(k=>{const v=m[k],base=v.scenarios24?.base,bull=v.scenarios24?.bull,bear=v.scenarios24?.bear,sc=signalClass(v);return `<tr data-coin="${k}" class="${k===SELECTED?'selected':''}"><td><div class="coin-cell"><span class="coin-icon">${k}</span><span><b>${k}</b><span class="sub">${money(v.price,v.price)}</span></span></div></td><td><span class="signal ${sc}">${esc(v.recommendation||'관망')}</span></td><td><span class="prob">${v.direction_confidence??'-'}%</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(v.direction_confidence||0)))}%"></i></div></td><td class="volume ${Number(v.volume_ratio||0)>=2?'hot':''}">${Number(v.volume_ratio||0).toFixed(2)}x</td><td>${base?.prob??'-'}%</td><td class="good">${bull?.prob??'-'}%</td><td class="bad">${bear?.prob??'-'}%</td></tr>`}).join('');const v=m[SELECTED];let detail='';if(v){detail=`<section class="detail"><div class="detail-head"><div><h3>${SELECTED} 상세 시나리오</h3><p>현재가 ${money(v.price,v.price)} · 24시간 ${Number(v.change)>=0?'+':''}${Number(v.change).toFixed(2)}% · 거래량 ${Number(v.volume_ratio||0).toFixed(2)}배</p></div><div class="trend-score">추세 강도<b>${v.trend_strength??'-'}/100</b></div></div><div class="horizon">24시간 확률 시나리오</div><div class="forecast">${scenario('기본',v.scenarios24?.base,v.price,'base')}${scenario('강세',v.scenarios24?.bull,v.price,'bull')}${scenario('약세',v.scenarios24?.bear,v.price,'bear')}</div><div class="horizon">1주 확률 시나리오</div><div class="forecast">${scenario('기본',v.scenarios7d?.base,v.price,'base')}${scenario('강세',v.scenarios7d?.bull,v.price,'bull')}${scenario('약세',v.scenarios7d?.bear,v.price,'bear')}</div><div class="evidence"><div class="evidence-box"><b>판단 근거</b>${(v.reasons||[]).map(esc).join(' · ')||'근거 데이터 계산 중'}</div><div class="evidence-box risk"><b>반대 시나리오·위험</b>${(v.risks||[]).map(esc).join(' · ')||'위험 데이터 계산 중'}</div></div></section>`}$('content').innerHTML=`<div class="panel-title"><div><h2>주요 코인 종합 비교</h2><p>방향·확률·거래량을 한 화면에서 비교하고 코인을 선택해 상세 시나리오를 확인합니다.</p></div><div class="statsline"><span class="stat-pill">감지 <b>${DATA.stats?.today??0}</b></span><span class="stat-pill">긴급 <b>${DATA.stats?.urgent??0}</b></span></div></div><div class="compare-wrap"><table class="compare"><thead><tr><th>자산</th><th>종합 판단</th><th>방향 신뢰</th><th>거래량</th><th>기본</th><th>강세</th><th>약세</th></tr></thead><tbody>${rows}</tbody></table></div>${detail}`;document.querySelectorAll('[data-coin]').forEach(r=>r.onclick=()=>{SELECTED=r.dataset.coin;renderRecommend()})}
function renderHot(){const themes=(DATA.hot_themes||[]).map(x=>`<article class="card"><div class="head"><span class="grade ${x.grade}">${esc(x.grade)}급</span><h2>${esc(x.title)}</h2></div><p>${esc(x.direction)} · ${esc(x.assets)}</p><div class="reason"><b>중요한 이유</b><br>${esc(x.reason)}<br><br><b>다음 확인</b><br>${esc(x.watch)}</div></article>`).join(''),events=(DATA.hot_events||[]).map(x=>`<article class="card"><h2>📅 ${esc(x.title)}</h2><p>${new Date(x.event_time).toLocaleString()} · ${esc(x.source)}</p><div class="reason">${esc(x.reason)}<br><br>${esc(x.watch)}</div></article>`).join('');$('content').innerHTML=`<div class="panel-title"><div><h2>핫이슈·예정 이벤트</h2><p>가격에 선반영될 수 있는 규제·기관·거래소 이벤트를 추적합니다.</p></div></div>${themes+events||'<div class="empty">현재 감지된 핫이슈가 없습니다.</div>'}`}
function renderIssues(){let rows=DATA.issues||[];if(['BTC','ETH','XRP','SOL','BNB'].includes(FILTER))rows=rows.filter(x=>String(x.assets).split(',').includes(FILTER));if(FILTER==='good')rows=rows.filter(x=>x.direction==='호재');if(FILTER==='bad')rows=rows.filter(x=>x.direction==='악재');$('content').innerHTML=`<div class="panel-title"><div><h2>${FILTER==='all'?'전체 실시간 이슈':FILTER==='good'?'호재 이슈':FILTER==='bad'?'악재 이슈':FILTER+' 관련 이슈'}</h2><p>최근 감지된 정보와 시장 반응을 시간순으로 표시합니다.</p></div></div>`+(rows.map(x=>`<article class="card"><div class="head"><span class="grade ${x.grade}">${x.grade}급</span><b class="${x.direction==='호재'?'good':x.direction==='악재'?'bad':'muted'}">${esc(x.direction)}</b><span>${esc(x.assets)}</span><span class="muted">검증 ${x.confidence}/100</span></div><div class="title">${esc(x.title)}</div><div class="summary">${esc(x.summary)}</div><div class="reason">${esc(x.reaction)}<br><br><b>투자자 체크</b><br>${esc(x.investor_note)}</div><div class="meta">${esc(x.source)} · ${x.published?new Date(x.published).toLocaleString():'시각 미제공'} · <a href="${esc(x.url)}" target="_blank" rel="noopener">원문 보기</a></div></article>`).join('')||'<div class="empty">조건에 맞는 최근 이슈가 없습니다.</div>')}
function render(){if(!DATA)return;const s=DATA.stats||{};$('today').textContent=s.today??0;$('urgent').textContent=s.urgent??0;$('good').textContent=s.good??0;$('bad').textContent=s.bad??0;$('collector').textContent=DATA.collector==='supabase-cloud'?'CLOUD 24H':'LOCAL';renderMarket();renderSide();if(FILTER==='recommend')renderRecommend();else if(FILTER==='hot')renderHot();else renderIssues()}
async function load(){try{if(!C.supabaseUrl||String(C.supabaseUrl).startsWith('PASTE_'))throw Error('config.js 설정 필요');const u=C.supabaseUrl.replace(/\/$/,'')+'/rest/v1/coin_snapshots?id=eq.live&select=payload,updated_at',r=await fetch(u,{headers:{apikey:C.supabaseAnonKey,Authorization:'Bearer '+C.supabaseAnonKey},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const rows=await r.json();if(!rows.length)throw Error('첫 동기화 대기');DATA=rows[0].payload;const age=(Date.now()-new Date(DATA.heartbeat||rows[0].updated_at))/1000;$('live').classList.toggle('off',age>Number(C.staleAfterSeconds||45));$('liveText').textContent=age>Number(C.staleAfterSeconds||45)?`수집 중단 · ${Math.floor(age)}초 전`:`실시간 · ${Math.max(0,Math.floor(age))}초 전`;render()}catch(e){$('live').classList.add('off');$('liveText').textContent='연결 대기 · '+e.message}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');FILTER=b.dataset.filter;render()});load();setInterval(load,Math.max(3,Number(C.refreshSeconds||5))*1000);
</script>
