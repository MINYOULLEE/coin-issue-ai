.ra-hero{position:relative;overflow:hidden;padding:20px;border:1px solid #3d5275;border-radius:13px;background:linear-gradient(135deg,#223451 0%,#182438 58%,#172131 100%);margin-bottom:12px}.ra-hero:after{content:"A";position:absolute;right:18px;top:-29px;color:rgba(91,124,245,.11);font:900 140px/1 var(--font-display)}.ra-hero-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.ra-eyebrow{color:#9bb1ff;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.ra-hero h2{margin:4px 0 5px;font:700 22px/1.2 var(--font-display)}.ra-hero p{margin:0;color:#aebbd0;font-size:11px}.ra-pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.ra-pill{padding:7px 10px;border:1px solid #41577c;border-radius:999px;background:rgba(12,21,35,.55);color:#cdd8ea;font-size:10px;font-weight:800}.ra-pill.live{border-color:#327564;color:#8be5c8;background:rgba(18,58,52,.75)}.ra-overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}.ra-kpi{min-height:100px;padding:14px;border:1px solid var(--line2);border-radius:11px;background:linear-gradient(145deg,#1b273b,#151f2f)}.ra-kpi small{display:block;color:var(--muted);font-size:10px;margin-bottom:7px}.ra-kpi strong{display:block;font:800 18px/1.25 var(--font-mono)}.ra-kpi span{display:block;color:#aab7c9;font-size:10px;margin-top:5px}.ra-section{padding:14px;border:1px solid var(--line2);border-radius:11px;background:#182334;margin-top:10px}.ra-section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.ra-section-head h3{margin:0;font:700 14px var(--font-display)}.ra-section-head span{color:var(--muted);font-size:10px}.ra-signal{display:grid;grid-template-columns:1.25fr repeat(4,1fr);gap:7px}.ra-signal>div{padding:11px;border:1px solid var(--line2);border-radius:9px;background:#141e2e}.ra-signal small{display:block;color:var(--muted);font-size:9px;margin-bottom:4px}.ra-signal b{font-size:12px}.ra-universe{display:flex;gap:7px;flex-wrap:wrap}.ra-coin{min-width:83px;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;background:#141e2e}.ra-coin b{display:block;font:800 12px var(--font-mono)}.ra-coin small{color:var(--muted);font-size:9px}.ra-coin.big{border-color:#536fb0;background:#1d2d4b}.ra-coin.long{border-color:#327564}.ra-coin.short{border-color:#824655}.ra-empty{padding:17px;border:1px dashed #42516a;border-radius:9px;text-align:center;color:var(--muted);font-size:11px;background:#151f2e}.ra-rules{display:grid;gap:7px}.ra-rule{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line2);border-radius:8px;background:#172131}.ra-rule i{font-style:normal;color:var(--green);font-weight:900}.ra-rule b{display:block;font-size:11px}.ra-rule span{display:block;color:var(--muted);font-size:9px;margin-top:2px}
.ra-coin{color:var(--text);text-align:left;cursor:pointer;transition:.15s}.ra-coin:hover{border-color:#637b9f;transform:translateY(-1px)}.ra-coin.selected{border-color:#7698ff;background:#263a60;box-shadow:0 0 0 1px rgba(118,152,255,.18) inset}.ra-guide{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:7px}.ra-guide>div{padding:11px;border:1px solid var(--line2);border-radius:9px;background:#141e2e}.ra-guide small{display:block;color:var(--muted);font-size:9px;margin-bottom:4px}.ra-guide b{font-size:12px}.ra-guide-note{margin-top:8px;padding:10px 11px;border-left:3px solid var(--blue);border-radius:7px;background:#151f2e;color:#b9c6d8;font-size:10px;line-height:1.6}
.ra-hero:after{content:"30"}
.tabs button[data-filter^="plan-a"]{color:#9ebcff;border-color:rgba(91,124,245,.22);background:rgba(91,124,245,.07)}.tabs button[data-filter^="plan-a"]:hover,.tabs button[data-filter^="plan-a"].on{color:#eef3ff;border-color:#6689f4;background:linear-gradient(135deg,rgba(46,75,145,.72),rgba(31,49,88,.88));box-shadow:0 0 0 1px rgba(102,137,244,.18) inset}.tabs button[data-filter^="plan-b"]{color:#d6a8ff;border-color:rgba(177,102,255,.23);background:rgba(144,72,216,.07)}.tabs button[data-filter^="plan-b"]:hover,.tabs button[data-filter^="plan-b"].on{color:#fbf2ff;border-color:#b56bf1;background:linear-gradient(135deg,rgba(103,49,151,.76),rgba(58,34,91,.9));box-shadow:0 0 0 1px rgba(181,107,241,.2) inset}.plan-b-hero{border-color:#7746a0;background:linear-gradient(135deg,#38224f 0%,#241b38 58%,#1a1829 100%)}.plan-b-hero:after{content:"B";color:rgba(200,126,255,.12)}.plan-b-hero .ra-eyebrow{color:#d4a1ff}.plan-b-hero .ra-pill{border-color:#704598;color:#ead5ff}.plan-b-overview .ra-kpi{border-color:#49305f;background:linear-gradient(145deg,#2b2039,#1c1928)}#bxHistoryLock{display:none!important}
.panel-title p,.history-head span,.locked{display:none!important}
.weekly-page{display:flex;flex-direction:column;gap:18px}.weekly-plan-title{margin:0 0 9px;font:700 14px var(--font-display)}.weekly-plan-title.wk-a{color:#9ebcff}.weekly-plan-title.wk-b{color:#d6a8ff}.weekly-empty{padding:17px;border:1px dashed #42516a;border-radius:9px;text-align:center;color:var(--muted);font-size:11px;background:#151f2e}.weekly-block{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.weekly-cell{min-width:88px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#172131;text-align:center}.weekly-cell small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.weekly-cell strong{font:800 14px var(--font-mono)}.weekly-cell.up strong{color:var(--green)}.weekly-cell.down strong{color:var(--red)}.weekly-note{margin-top:2px;color:var(--muted);font-size:10px}
@media(max-width:900px){.structure-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.ra-overview{grid-template-columns:repeat(2,minmax(0,1fr))}.ra-signal,.ra-guide{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.ra-hero-top{display:block}.ra-pills{justify-content:flex-start;margin-top:12px}.ra-overview,.ra-signal,.ra-guide{grid-template-columns:1fr}}
</style>

<script>
const C=window.COIN_ISSUE_CONFIG||{};let DATA=null,FILTER='plan-a',SELECTED='BTC',HISTORY={rows:[],page:1,pages:1,total:0,loading:false},BX_HISTORY={rows:[],page:1,pages:1,total:0,stats:{},loading:false},PB_HISTORY={rows:[],page:1,pages:1,total:0,stats:{},loading:false};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=(n,p=100)=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:p<10?4:2}),marketMoney=v=>v?.currency==='KRW'?'₩'+Number(v.price||0).toLocaleString('ko-KR',{maximumFractionDigits:2}):money(v?.price,v?.price);
function signalClass(v){const r=String(v?.recommendation||'');return r.includes('상승')?'up':r.includes('하락')?'down':'wait'}
function scenario(label,o,p,type){return `<div class="scenario ${type}"><div class="scenario-top"><b>${label}</b><strong>${o?.prob??'-'}%</strong></div><div class="center">${money(o?.center,p)} <span class="${Number(o?.change||0)>=0?'good':'bad'}">${Number(o?.change||0)>=0?'+':''}${Number(o?.change||0).toFixed(2)}%</span></div><small>범위 ${money(o?.low,p)} ~ ${money(o?.high,p)}</small><small>${esc(o?.trigger||'')}</small></div>`}
function renderMarket(){
 const m=DATA?.market||{},keys=['BTC','ETH','XRP','TRX','SOL','USDT'];
 $('market').innerHTML=keys.map(k=>{
  const v=m[k],upbit=k==='USDT',age=Date.now()-Date.parse(v?.updated||'');
  const valid=Number.isFinite(Number(v?.price))&&Number(v?.price)>0&&(!upbit||(v.source==='Upbit'&&v.currency==='KRW'));
  const stale=upbit&&valid&&(!Number.isFinite(age)||age>180000);
  const change=valid&&v.change!=null&&Number.isFinite(Number(v.change))?Number(v.change):null;
  return `<div class="ticker${upbit?' ticker-upbit':''}" data-market="${k}"><div class="ticker-label"><b>${k}</b>${upbit?'<small>업비트 · 원화</small>':''}</div><div class="price">${valid?marketMoney(v):'—'}</div><span class="${!valid||stale?'muted':change==null?'muted':change>=0?'good':'bad'}">${!valid?'조회 대기':stale?'갱신 지연':change==null?'변동률 미확인':`${change>=0?'+':''}${change.toFixed(2)}%`}</span></div>`;
 }).join('');
}
function kst(t){return t?new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Bangkok',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t))+' 태국시간':'-'}
function outcomeLabel(s){return s==='active'||s==='weakening'?'진행 중':s==='success'?'성공':s==='failure'?'실패':s==='neutral'?'중립':s}
function fmtDuration(sec){sec=Math.max(0,Number(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h+'시간 '+m+'분'}
function strategyName(x){const n={answer_mdd30:'A Stage75 · 낙폭방어형',strategy_a:'A · 강추세 롱',strategy_b:'B · 강추세 숏',strategy_c:'C · 하락장 되돌림',strategy_d:'D · 전환장 방향',strategy_f:'F · 진짜 돌파',strategy_g:'G · 가짜 돌파'};return n[x?.signal_type]||'이전 전략'}
function exitRule(x){if(x?.signal_type==='answer_mdd30')return {label:'다음 재판정',value:'매일 08:00 태국시간'};if(x?.signal_type==='strategy_f')return {label:'다음 정리',value:'24시간 보유 후 종료'};if(x?.signal_type==='strategy_d')return {label:'다음 확인',value:'전환장 종료 또는 14일'};return {label:'청산 관리',value:'시간봉 손실 제한 · 고정 익절 없음'}}
function nextMdd30Decision(){const now=new Date(),n=new Date(now);n.setUTCHours(1,0,0,0);if(n<=now)n.setUTCDate(n.getUTCDate()+1);return kst(n.toISOString())}
function renderResearchA(){
  const m=DATA.market||{},mr=DATA.market_regime||{},assets=['BTC','ETH','XRP','TRX','SOL'],active=(DATA.active_signals||[]).filter(x=>x.signal_type==='answer_mdd30'),carried=mr.carried_positions||[];

function pbSide(status){$('sidepanel').innerHTML='<div class="side-head"><h3>B플랜 공격형</h3><span>'+status+'</span></div><div class="focus"><h4>A와 완전 분리</h4><p>B 전용 전략·계정·API·신호·주문·기록만 사용합니다.</p></div><div class="focus"><h4>안전 기준</h4><p>확정봉 다음 시가 진입, 신호 5분 만료, 중복 주문 차단을 적용합니다.</p></div>'}
function renderPlanBLive(){const token=sessionStorage.getItem('plan_b_dashboard_session');if(!token){$('content').innerHTML=pbHero('B플랜 빙엑스 실거래','계좌 및 자동주문 제어는 비밀번호 인증 후에만 열립니다.')+'<div class="bx-login"><h3>🔒 B플랜 관리자 전용</h3><div class="bx-login-row"><input id="pbPassword" type="password" placeholder="비밀번호 입력"><button id="pbLogin">열기</button></div><div id="pbError" class="bx-error"></div></div>';pbSide('LOCKED');$('pbLogin').onclick=async()=>{try{const r=await fetch(PB_URL(),{method:'POST',headers:bxHeaders(),body:JSON.stringify({action:'login',password:$('pbPassword').value})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'인증 실패');sessionStorage.setItem('plan_b_dashboard_session',j.session);renderPlanBLive()}catch(e){$('pbError').textContent=e.message}};return}loadPlanBLive(token)}
async function loadPlanBLive(token){try{const responses=await Promise.all(['account','trading_state'].map(action=>fetch(PB_URL(),{method:'POST',headers:bxHeaders(token),body:JSON.stringify({action}),cache:'no-store'})));const [a,s]=await Promise.all(responses.map(r=>r.json()));if(responses.some(r=>r.status===401)){sessionStorage.removeItem('plan_b_dashboard_session');return renderPlanBLive()}if(responses.some(r=>!r.ok)||!a.ok||!s.ok)throw Error(a.error||s.error||'조회 실패');const ac=a.account||{};$('content').innerHTML=pbHero('B플랜 빙엑스 실거래','B 시작 기준 $650 · 실제 계좌 금액은 별도 조회')+'<div class="metric-grid"><div class="metric-card"><small>시작 기준금</small><b>$650.00</b></div><div class="metric-card"><small>실제 Equity</small><b>$'+Number(ac.equity).toFixed(2)+'</b></div><div class="metric-card"><small>가용 담보</small><b>$'+Number(ac.available_margin).toFixed(2)+'</b></div><div class="metric-card"><small>포지션</small><b>'+Number(a.open_position_count)+'개</b></div></div><div class="empty">자동매매 '+(s.state?.enabled?'ON':'OFF')+' · '+(s.state?.test_mode?'TEST':'LIVE')+'<br>실거래 활성화는 잠겨 있습니다.</div>';pbSide('AUTHENTICATED')}catch(e){$('content').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
const WEEKLY_URL=()=>C.supabaseUrl.replace(/\/$/,'')+'/functions/v1/weekly-snapshot';
let WEEKLY={rows:[],loaded:false,loading:false,error:null};
async function fetchWeekly(){if(WEEKLY.loading)return;WEEKLY.loading=true;if(!WEEKLY.loaded)$('content').innerHTML='<div class="empty">주차별 기록을 불러오는 중입니다.</div>';try{const r=await fetch(WEEKLY_URL(),{method:'POST',headers:bxHeaders(),body:JSON.stringify({action:'weekly_history'}),cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'주차별 기록 조회 실패');WEEKLY={rows:j.rows||[],loaded:true,loading:false,error:null};renderWeeklyRecord()}catch(e){WEEKLY.loading=false;WEEKLY.error=e.message;$('content').innerHTML='<div class="empty">주차별 기록 조회 실패 · '+esc(e.message)+'</div>'}}
function weeklyBlocks(rows){const blocks=[];rows.forEach(r=>{const bi=Math.floor(r.week_no/11);(blocks[bi]=blocks[bi]||[]).push(r)});return blocks}
function wkDate(t){return t?new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit'}).format(new Date(t)):'-'}
function weeklyPlanSection(name,cls,rows){if(!rows.length)return '<div class="weekly-plan"><h3 class="weekly-plan-title '+cls+'">'+name+'</h3><p class="weekly-empty">아직 기록이 없습니다 · 다음 월요일 08:00에 첫 기록이 쌓입니다.</p></div>';const blocks=weeklyBlocks(rows);let html='<div class="weekly-plan"><h3 class="weekly-plan-title '+cls+'">'+name+'</h3>';blocks.forEach(block=>{if(!block)return;html+='<div class="weekly-block">'+block.map((r,i)=>{const prev=i>0?block[i-1]:null,dir=prev?(Number(r.balance_usd)>Number(prev.balance_usd)?'up':Number(r.balance_usd)<Number(prev.balance_usd)?'down':''):'';return '<div class="weekly-cell '+dir+'"><small>'+esc(r.label)+' · '+wkDate(r.captured_at)+'</small><strong>'+money(r.balance_usd)+'</strong></div>'}).join('')+'</div>'});html+='</div>';return html}
function renderWeeklyRecord(){const rowsA=WEEKLY.rows.filter(r=>r.plan==='A'),rowsB=WEEKLY.rows.filter(r=>r.plan==='B');$('content').innerHTML='<div class="panel-title"><div><h2>주차별 기록</h2><p>매주 월요일 오전 8시 자동 갱신</p></div></div><div class="weekly-page">'+weeklyPlanSection('A플랜','wk-a',rowsA)+weeklyPlanSection('B플랜','wk-b',rowsB)+'<p class="weekly-note">매주 월요일 08:00(KST)에 A·B 각 플랜의 시작 자본 + 확정 손익 기준 자산을 한 칸씩 자동으로 더합니다 · 초록은 전주 대비 상승, 빨강은 하락.</p></div>';$('sidepanel').innerHTML='<div class="side-head"><h3>주차별 기록</h3><span>WEEKLY</span></div><div class="focus"><h4>매주 자동 갱신</h4><p>매주 월요일 08:00(KST)에 A·B 플랜의 누적 자산이 한 칸씩 새로 추가됩니다.</p></div>'}
function render(bg){if(!DATA)return;$('collector').textContent=DATA.collector==='supabase-cloud'?'클라우드 매매 연결':'매매 연결 확인';renderMarket();if(FILTER==='plan-a')renderResearchA();else if(FILTER==='plan-b')renderPlanB('recommend');else if(FILTER==='plan-a-bingx'){if(!bg)renderBingX()}else if(FILTER==='plan-a-history'){if(!bg)renderBingXHistory()}else if(FILTER==='plan-b-bingx')renderPlanB('live');else if(FILTER==='plan-b-history')renderPlanB('history');else if(FILTER==='weekly-record'){if(!bg)fetchWeekly()}else{FILTER='plan-a';renderResearchA()}}
async function load(bg){try{if(!C.supabaseUrl||String(C.supabaseUrl).startsWith('PASTE_'))throw Error('config.js 설정 필요');const u=C.supabaseUrl.replace(/\/$/,'')+'/rest/v1/coin_snapshots?id=eq.live&select=payload,updated_at',r=await fetch(u,{headers:{apikey:C.supabaseAnonKey,Authorization:'Bearer '+C.supabaseAnonKey},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const rows=await r.json();if(!rows.length)throw Error('첫 동기화 대기');DATA=rows[0].payload;const age=(Date.now()-new Date(DATA.heartbeat||rows[0].updated_at))/1000;$('live').classList.toggle('off',age>Number(C.staleAfterSeconds||45));$('liveText').textContent=age>Number(C.staleAfterSeconds||45)?`수집 중단 · ${Math.floor(age)}초 전`:`실시간 · ${Math.max(0,Math.floor(age))}초 전`;render(bg)}catch(e){$('live').classList.add('off');$('liveText').textContent='연결 대기 · '+e.message}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');FILTER=b.dataset.filter;render()});load();setInterval(()=>load(true),Math.max(3,Number(C.refreshSeconds||5))*1000);
