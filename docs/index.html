function bxToggleCard(state,openCount){const on=!!(state&&state.enabled),test=!!(state&&state.test_mode);return '<section class="bx-section"><h3>실거래 자동주문 스위치</h3><div class="bx-toggle-row"><div class="bx-toggle-status"><span class="bx-badge '+(on?'safe':'off')+'">'+(on?'● 작동중':'○ 정지됨')+'</span>'+(on?('<span class="bx-badge">'+(test?'테스트 모드 · 소액':'본 규칙 적용')+'</span>'):'')+'<span class="muted">열려있는 실거래 '+openCount+'건</span></div><button id="bxTradingToggle" class="bx-toggle-btn '+(on?'stop':'start')+'">'+(on?'⏸ 정지시키기':'▶ 작동시키기')+'</button></div><p class="bx-toggle-hint">정지시키면 이미 열려있는 포지션은 그대로 유지되고, 새로 오는 신호에 대한 신규 주문만 막힙니다.</p></section>'}
async function bxToggleTrading(token,enable){const btn=$('bxTradingToggle');if(btn){btn.disabled=true;btn.textContent='처리 중...'}try{const r=await fetch(C.supabaseUrl.replace(/\/$/,'')+'/functions/v1/bingx-account-read',{method:'POST',headers:bxHeaders(token),body:JSON.stringify({action:'trading_toggle',enabled:enable}),cache:'no-store'}),j=await r.json();if(r.status===401){sessionStorage.removeItem('bingx_dashboard_session');renderBingX();return}if(!r.ok||!j.ok)throw Error(j.error||'상태 변경 실패');loadBingXAccount(token)}catch(e){alert('상태 변경 실패: '+e.message);if(btn){btn.disabled=false}}}
async function loadBingXAccount(token){try{const [ar,sr]=await Promise.all([fetch(C.supabaseUrl.replace(/\/$/,'')+'/functions/v1/bingx-account-read',{method:'POST',headers:bxHeaders(token),body:JSON.stringify({action:'account'}),cache:'no-store'}),fetch(C.supabaseUrl.replace(/\/$/,'')+'/functions/v1/bingx-account-read',{method:'POST',headers:bxHeaders(token),body:JSON.stringify({action:'trading_state'}),cache:'no-store'})]);if(ar.status===401||sr.status===401){sessionStorage.removeItem('bingx_dashboard_session');renderBingX();return}const j=await ar.json();if(!ar.ok||!j.ok)throw Error(j.error||'계좌 조회 실패');const sj=await sr.json().catch(()=>({ok:false})),st=(sj&&sj.ok)?sj.state:null,on=!!(st&&st.enabled),openCount=(sj&&sj.open_trades)?sj.open_trades.length:0;$('content').innerHTML='<div class="bingx-page">'+bxHero('<span class="bx-badge safe">인증됨</span>')+'<div class="bx-live-actions"><button id="bxLogout">잠그기</button></div>'+bxToggleCard(st,openCount)+'<div class="bx-grid"><div class="bx-card"><small>선물계좌 담보금</small><strong>•••• USDT</strong></div><div class="bx-card"><small>보유 포지션</small><strong>비공개</strong></div><div class="bx-card"><small>실계좌 손익</small><strong>비공개</strong></div><div class="bx-card"><small>주문 엔진</small><strong class="'+(on?'good':'bad')+'">'+(on?'ON':'OFF')+'</strong></div></div><div class="bx-note">실제 보유 잔액·포지션·평단·청산가는 화면에 표시하지 않도록 가렸습니다.</div>'+researchALiveCard()+bxSettings()+'</div>';$('bxLogout').onclick=()=>{sessionStorage.removeItem('bingx_dashboard_session');renderBingX()};const toggleBtn=$('bxTradingToggle');if(toggleBtn)toggleBtn.onclick=()=>bxToggleTrading(token,!on);$('sidepanel').innerHTML='<div class="side-head"><h3>실거래 보호 상태</h3><span>'+(on?'LIVE':'STOPPED')+'</span></div><div class="focus"><span class="tag">'+(on?'주문 ON':'주문 OFF')+'</span><h4>'+(on?'30% 방어형 자동주문 작동 중':'실거래 자동주문 정지됨')+'</h4><p>'+(on?'5종목 독립 판단과 완료 봉 재판정을 통과한 MDD30 신호만 실제 주문으로 전송합니다.':'신호가 나와도 신규 주문은 전송되지 않습니다. 열린 포지션 관리는 계속됩니다.')+'</p></div>'}catch(e){$('content').innerHTML='<div class="empty">빙엑스 계좌 조회 실패 · '+esc(e.message)+'</div>'}}

function renderBingXHistory(){const token=sessionStorage.getItem('bingx_dashboard_session');if(!token){$('content').innerHTML='<div class="bingx-page">'+bxHero('')+'<div class="bx-login"><h3>🔒 실거래 기록 관리자 인증</h3><p>빙엑스 실거래 화면과 동일한 비밀번호를 사용합니다.</p><div class="bx-login-row"><input id="bxPassword" type="password" autocomplete="current-password" placeholder="비밀번호 입력"><button id="bxLogin">열기</button></div><div id="bxError" class="bx-error"></div></div></div>';$('sidepanel').innerHTML='<div class="side-head"><h3>실거래 기록</h3><span>LOCKED</span></div><div class="focus"><h4>인증 필요</h4><p>실제 거래 기록과 손익 통계는 비밀번호 확인 후에만 표시합니다.</p></div>';const input=$('bxPassword'),btn=$('bxLogin');input.onkeydown=e=>{if(e.key==='Enter')btn.click()};btn.onclick=async()=>{btn.disabled=true;$('bxError').textContent='확인 중...';try{const r=await fetch(C.supabaseUrl.replace(/\/$/,'')+'/functions/v1/bingx-account-read',{method:'POST',headers:bxHeaders(),body:JSON.stringify({action:'login',password:input.value}),cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'인증 실패');sessionStorage.setItem('bingx_dashboard_session',j.session);fetchBingXHistory(1)}catch(e){$('bxError').textContent=e.message;input.value='';input.focus()}finally{btn.disabled=false}};return}fetchBingXHistory(BX_HISTORY.page||1)}
async function fetchBingXHistory(page=1){const token=sessionStorage.getItem('bingx_dashboard_session');BX_HISTORY.loading=true;$('content').innerHTML='<div class="empty">실제 거래 기록을 불러오는 중입니다.</div>';try{const r=await fetch(C.supabaseUrl.replace(/\/$/,'')+'/functions/v1/bingx-account-read',{method:'POST',headers:bxHeaders(token),body:JSON.stringify({action:'trade_history',page,limit:20}),cache:'no-store'}),j=await r.json();if(r.status===401){sessionStorage.removeItem('bingx_dashboard_session');BX_HISTORY.page=1;renderBingXHistory();return}if(!r.ok||!j.ok)throw Error(j.error||'기록 조회 실패');BX_HISTORY={...j,loading:false};renderBingXHistoryData()}catch(e){$('content').innerHTML='<div class="empty">실거래 기록 조회 실패 · '+esc(e.message)+'</div>'}}
function renderBingXHistoryData(){const j=BX_HISTORY,st=j.stats||{},rows=j.rows||[];let pages='';if(j.pages>1){pages='<div class="pagination"><button data-bxp="'+(j.page-1)+'" '+(j.page<=1?'disabled':'')+'>‹</button>';for(let p=Math.max(1,j.page-3);p<=Math.min(j.pages,j.page+3);p++)pages+='<button data-bxp="'+p+'" class="'+(p===j.page?'on':'')+'">'+p+'</button>';pages+='<button data-bxp="'+(j.page+1)+'" '+(j.page>=j.pages?'disabled':'')+'>›</button></div>'}const cards=rows.map(x=>{const pnl=x.net_pnl_usd,roi=x.margin_return_pct,rm=x.r_multiple,open=x.status==='open',ev=open?'진행 중':esc(x.evaluation||'중립');return '<details class="trade-card"><summary><div class="trade-card-head"><div class="trade-identity"><span class="result-badge '+(open?'active':Number(pnl)>0?'success':Number(pnl)<0?'failure':'neutral')+'">'+ev+'</span><strong>'+esc(x.symbol)+' · '+(String(x.side).toLowerCase()==='long'?'LONG':'SHORT')+'</strong><span class="muted">'+esc(x.signal_type||'-')+'</span></div><div class="trade-pnl '+(Number(pnl||0)>=0?'good':'bad')+'">'+(open?'진행 중':(Number(pnl)>=0?'+$':'-$')+Math.abs(Number(pnl)).toFixed(2))+'</div></div><div class="trade-meta">'+kst(x.created_at)+(x.closed_at?' → '+kst(x.closed_at):'')+'</div><div class="trade-mini"><span>담보금<b>$'+Number(x.margin_usd||0).toFixed(2)+'</b></span><span>레버리지<b>'+Number(x.leverage||0)+'x</b></span><span>담보 수익률<b class="'+(Number(roi||0)>=0?'good':'bad')+'">'+(roi==null?'-':(Number(roi)>=0?'+':'')+Number(roi).toFixed(2)+'%')+'</b></span><span>R 배수<b>'+(rm==null?'-':Number(rm).toFixed(2)+'R')+'</b></span></div></summary><div class="trade-card-body"><div class="trade-detail-grid"><span>진입가<b>'+money(x.fill_price||x.entry_price)+'</b></span><span>손절가<b>'+(x.stop_price==null?'-':money(x.stop_price))+'</b></span><span>'+(x.signal_type==='research_a_big'?'트레일링':'다음 리밸런싱')+'<b>'+(x.signal_type==='research_a_big'?'3% · 시간봉 갱신':x.signal_type==='research_a_small'?'24시간 재선정':(x.target_price==null?'-':money(x.target_price)))+'</b></span><span>종료가<b>'+(x.close_price==null?'-':money(x.close_price))+'</b></span><span>포지션 규모<b>$'+Number(x.notional_usd||0).toFixed(2)+'</b></span><span>수량<b>'+Number(x.quantity||0)+'</b></span><span>수수료<b>$'+Number(x.fee_usd||0).toFixed(4)+'</b></span><span>기초 방향수익<b>'+(x.base_return_pct==null?'-':Number(x.base_return_pct).toFixed(2)+'%')+'</b></span></div><div class="trade-reason"><b>종료 사유:</b> '+esc(x.close_reason||x.reject_reason||(open?'현재 진행 중':'기록 없음'))+'</div></div></details>'}).join('');$('content').innerHTML='<div class="panel-title"><div><h2>빙엑스 실거래 기록</h2><p>BingX 포지션 히스토리 API에서 조회한 실제 체결 기록만 표시하며 모의추천·내부 주문 기록과 섞지 않습니다.</p></div><div class="statsline"><button id="bxHistoryLock" class="stat-pill" style="cursor:pointer;color:var(--text)">잠그기</button></div></div><div class="metric-grid"><div class="metric-card"><small>승률</small><b>'+Number(st.win_rate||0).toFixed(1)+'%</b></div><div class="metric-card win"><small>승리</small><b class="good">'+Number(st.wins||0)+'번 <em>+$'+Number(st.win_pnl_usd||0).toFixed(2)+'</em></b></div><div class="metric-card loss"><small>패배</small><b class="bad">'+Number(st.losses||0)+'번 <em>-$'+Math.abs(Number(st.loss_pnl_usd||0)).toFixed(2)+'</em></b></div><div class="metric-card fee"><small>총 수수료</small><b class="bad">-$'+Math.abs(Number(st.total_fee_usd||0)).toFixed(2)+'</b></div><div class="metric-card net"><small>실제 순수익</small><b class="'+(Number(st.total_pnl_usd||0)>=0?'good':'bad')+'">'+(Number(st.total_pnl_usd||0)>=0?'+$':'-$')+Math.abs(Number(st.total_pnl_usd||0)).toFixed(2)+'</b></div><div class="metric-card margin"><small>현재 담보금 · 시작 $100</small><b class="'+(Number(st.current_balance_usd??100)>=100?'good':'bad')+'">$'+Number(st.current_balance_usd??100).toFixed(2)+'</b></div></div>'+(rows.length?'<div class="trade-cards">'+cards+'</div>':'<div class="history-empty">아직 실제 거래 기록이 없습니다.</div>')+pages;$('bxHistoryLock').onclick=()=>{sessionStorage.removeItem('bingx_dashboard_session');BX_HISTORY.page=1;renderBingXHistory()};document.querySelectorAll('[data-bxp]').forEach(b=>b.onclick=()=>{const p=Number(b.dataset.bxp);if(p>=1&&p<=j.pages&&p!==j.page)fetchBingXHistory(p)});$('sidepanel').innerHTML='<div class="side-head"><h3>실거래 성과</h3><span>PRIVATE</span></div><div class="focus"><h4>모의 기록과 분리</h4><p>평균 수익률은 종료된 실제 거래의 순손익을 담보금으로 나누어 계산합니다.</p></div><div class="focus"><h4>현재 상태</h4><p>진행 중 거래는 성과 통계에서 제외하고 종료 후 자동 반영합니다.</p></div>'}

function render(bg){if(!DATA)return;const s=DATA.stats||{};$('today').textContent=s.today??0;$('urgent').textContent=s.urgent??0;$('good').textContent=s.good??0;$('bad').textContent=s.bad??0;$('collector').textContent=DATA.collector==='supabase-cloud'?'MDD30 · LIVE':'LOCAL';renderMarket();renderSide();if(FILTER==='recommend')renderResearchA();else if(FILTER==='history')renderHistory();else if(FILTER==='hot')renderHot();else if(FILTER==='bingx'){if(!bg)renderBingX()}else if(FILTER==='bingx-history'){if(!bg)renderBingXHistory()}else renderIssues()}
async function load(bg){try{if(!C.supabaseUrl||String(C.supabaseUrl).startsWith('PASTE_'))throw Error('config.js 설정 필요');const u=C.supabaseUrl.replace(/\/$/,'')+'/rest/v1/coin_snapshots?id=eq.live&select=payload,updated_at',r=await fetch(u,{headers:{apikey:C.supabaseAnonKey,Authorization:'Bearer '+C.supabaseAnonKey},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const rows=await r.json();if(!rows.length)throw Error('첫 동기화 대기');DATA=rows[0].payload;const age=(Date.now()-new Date(DATA.heartbeat||rows[0].updated_at))/1000;$('live').classList.toggle('off',age>Number(C.staleAfterSeconds||45));$('liveText').textContent=age>Number(C.staleAfterSeconds||45)?`수집 중단 · ${Math.floor(age)}초 전`:`실시간 · ${Math.max(0,Math.floor(age))}초 전`;render(bg)}catch(e){$('live').classList.add('off');$('liveText').textContent='연결 대기 · '+e.message}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');FILTER=b.dataset.filter;render();if(FILTER==='history')fetchHistory(HISTORY.page||1)});load();setInterval(()=>load(true),Math.max(3,Number(C.refreshSeconds||5))*1000);
</script>
